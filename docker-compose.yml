services:
  mondonhedo-acessivel:
    build: .
    image: mondonhedo-acessivel:latest
    container_name: mondonhedo_acessivel
    restart: unless-stopped
    ports:
      - "90:8000"
    environment:
      # ⚠️ SEGURIDADE: Poña ENABLE_EDIT_MODE a "false" en produción para bloquear calquera modificación
      - ENABLE_EDIT_MODE=true
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./public:/app/public
      - ./server.py:/app/server.py
    working_dir: /app
    command: python3 server.py
