server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(geojson|json|css|js|png|jpg|jpeg|svg|woff2|woff|ttf)$ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
